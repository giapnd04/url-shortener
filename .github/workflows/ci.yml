name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UrlShortener.sln

      - name: Build
        run: dotnet build UrlShortener.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/UrlShortener.UnitTests -c Release --no-build

      # From Day 16 these use Testcontainers (SQL Server, later Redis) via the runner's Docker daemon.
      - name: Integration tests
        run: dotnet test tests/UrlShortener.IntegrationTests -c Release --no-build

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t url-shortener-api:ci .
